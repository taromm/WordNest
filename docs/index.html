<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#41342d">
  <title>词栖 · 四册单词本</title>
  <link rel="stylesheet" href="style.css?v=20261102d">
</head>
<body>
  <a class="skip-link" href="#word-list">跳到单词列表</a>
  <button type="button" id="btn-menu" class="menu-btn" aria-label="打开菜单" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <div id="menu-backdrop" class="menu-backdrop" hidden></div>
  <div class="desk">
    <aside class="sidebar" aria-label="词栖导航">
      <div class="sidebar-main">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">词</div>
          <div>
            <strong>词栖</strong>
            <span>四册单词本</span>
          </div>
        </div>
        <nav id="book-nav" class="book-nav"></nav>
        <div class="exam-slot">
          <button type="button" id="btn-exam" class="exam-card empty"></button>
        </div>
      </div>
      <div class="sidebar-actions">
        <button type="button" id="btn-review-due" class="ghost">开始今日复习</button>
        <button type="button" id="btn-cloud-down" class="ghost" title="用云端数据覆盖本机">云端 → 本机</button>
        <button type="button" id="btn-cloud-up" class="ghost" title="用本机数据覆盖云端">本机 → 云端</button>
        <button type="button" id="btn-settings" class="ghost">设置与备份</button>
      </div>
      <p class="data-hint" id="data-hint">单词保存在本机用户目录，更新软件不会清空。</p>
    </aside>
    <main class="stage" id="main-content">
      <div class="stage-inner">
        <header class="topbar">
          <div class="topbar-title">
            <p class="eyebrow" id="book-en">Reading</p>
            <h1 id="book-title">阅读</h1>
            <p class="lede" id="book-hint">篇章里遇见的词</p>
          </div>
          <div class="stats" id="book-stats" aria-label="本册学习概况"></div>
        </header>
        <div class="toolbar">
          <div class="toolbar-filters">
            <label class="search search-main">
              <span>搜索单词</span>
              <span class="input-wrap">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                <input id="search" type="search" placeholder="单词、释义或标签">
              </span>
            </label>
            <label class="search">
              <span>来源筛选</span>
              <select id="tag-filter">
                <option value="">全部来源</option>
                <option value="__untagged__">没有标记</option>
              </select>
            </label>
          </div>
          <div class="toolbar-groups">
            <div class="action-group">
              <span class="action-label">加入</span>
              <div class="toolbar-actions">
                <button type="button" id="btn-add" class="primary" title="快捷键 Ctrl/⌘ + N">新增单词</button>
                <button type="button" id="btn-scan" class="secondary">图片识词</button>
                <button type="button" id="btn-manage" class="tea-manage">批量整理</button>
              </div>
            </div>
            <div class="action-group">
              <span class="action-label">学习</span>
              <div class="toolbar-actions">
                <button type="button" id="btn-review-book" class="tea-review">复习本册</button>
                <button type="button" id="btn-dictation" class="tea-dictation" hidden>听写</button>
                <button type="button" id="btn-speak-all" class="tea-speak" hidden>顺序朗读</button>
              </div>
            </div>
            <div class="action-group action-group-end">
              <span class="action-label">工具</span>
              <div class="toolbar-actions">
                <button type="button" id="btn-export" class="tea-export">导出</button>
                <button type="button" id="btn-notebook" class="tea-note">笔记本</button>
              </div>
            </div>
          </div>
          <div class="mobile-quick-actions" aria-label="本册快捷操作">
            <button type="button" data-mobile-action="review">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4.5h9.5A2.5 2.5 0 0 1 18 7v12.5H8.5A2.5 2.5 0 0 1 6 17V4.5Z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M6 17a2.5 2.5 0 0 1 2.5-2.5H18M9 8h6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
              <span>复习本册</span>
            </button>
            <button type="button" data-mobile-action="batch">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h11M8 12h11M8 18h11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/></svg>
              <span>批量加入</span>
            </button>
            <button type="button" data-mobile-action="more" aria-haspopup="dialog">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.7" fill="currentColor"/><circle cx="12" cy="12" r="1.7" fill="currentColor"/><circle cx="19" cy="12" r="1.7" fill="currentColor"/></svg>
              <span>更多工具</span>
            </button>
          </div>
        </div>
        <section id="word-list" class="word-list" aria-live="polite"></section>
      </div>
    </main>
  </div>
  <nav id="mobile-nav" class="mobile-nav" aria-label="单词本快捷导航"></nav>
  <div id="overlay" class="overlay" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <aside id="update-banner" class="update-banner" hidden>
    <strong>词栖有更新</strong>
    <p id="update-copy">点下面即可更新，并重新打开。单词不会被清掉。</p>
    <div class="modal-actions">
      <button type="button" class="ghost" id="update-later">稍后</button>
      <button type="button" class="primary" id="update-apply">更新并重启</button>
    </div>
  </aside>
  <script src="highlight.js"></script>
  <script src="app.js?v=20261103a"></script>
  <script>
    if (!window.__wordnestBooted) {
      var list = document.getElementById('word-list');
      if (list) list.innerHTML = '<article class="empty-card"><h2>界面脚本没有加载</h2><p>请完全退出词栖后，在项目目录运行 npm start。</p></article>';
    }
  </script>
</body>
</html>
